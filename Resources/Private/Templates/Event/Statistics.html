<f:layout name="Default" />

<f:section name="main">
<div class="rescue-statistics">

    <f:if condition="{stationName}">
        <f:then><h1 class="rescue-statistics__station">Einsatzstatistik: {stationName}</h1></f:then>
        <f:else><h1 class="rescue-statistics__station">Einsatzstatistik</h1></f:else>
    </f:if>

    <f:if condition="{statistics}">
        <f:then>
            <f:for each="{statistics}" as="yearData" key="year">
                <div class="rescue-statistics__year">
                    <h3 class="rescue-statistics__year-title">
                        {year}
                        <span class="rescue-statistics__total">({yearData.total} Einsätze gesamt)</span>
                        <f:if condition="{yearData.yearTotalDuration}">
                            <span class="rescue-statistics__total">— Gesamtdauer: {yearData.yearTotalDuration}</span>
                        </f:if>
                    </h3>

                    <div class="rescue-statistics__layout">

                        <!-- Tortendiagramm als SVG -->
                        <div class="rescue-statistics__chart-wrap">
                            <svg viewBox="0 0 220 220" width="220" height="220" xmlns="http://www.w3.org/2000/svg">
                                <f:for each="{yearData.svgPaths}" as="slice">
                                    <f:if condition="{slice.type} == 'circle'">
                                        <f:then>
                                            <circle cx="110" cy="110" r="100" fill="{slice.color}">
                                                <title>{slice.title}: {slice.count} Einsätze ({slice.percent} %)</title>
                                            </circle>
                                        </f:then>
                                        <f:else>
                                            <path d="{slice.d}" fill="{slice.color}">
                                                <title>{slice.title}: {slice.count} Einsätze ({slice.percent} %)</title>
                                            </path>
                                        </f:else>
                                    </f:if>
                                </f:for>
                            </svg>
                        </div>

                        <!-- Tabelle -->
                        <div class="rescue-statistics__table-wrap">
                            <table class="rescue-statistics__table">
                                <thead>
                                    <tr>
                                        <th></th>
                                        <th>Kategorie</th>
                                        <th class="rescue-statistics__num">Anzahl</th>
                                        <th class="rescue-statistics__num">Anteil</th>
                                        <th class="rescue-statistics__num">Ø Dauer</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <f:for each="{yearData.categories}" as="cat">
                                        <tr>
                                            <td><span class="rescue-statistics__dot" style="background:{cat.color}"></span></td>
                                            <td>{cat.title}</td>
                                            <td class="rescue-statistics__num">{cat.count}</td>
                                            <td class="rescue-statistics__num">{cat.percent} %</td>
                                            <td class="rescue-statistics__num">{cat.avgDuration}</td>
                                        </tr>
                                    </f:for>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="2"><strong>Gesamt</strong></td>
                                        <td class="rescue-statistics__num"><strong>{yearData.total}</strong></td>
                                        <td class="rescue-statistics__num"><strong>100 %</strong></td>
                                        <td class="rescue-statistics__num">—</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                    </div>
                </div>
            </f:for>
        </f:then>
        <f:else>
            <p class="rescue-statistics__empty">Keine Einsatzdaten vorhanden.</p>
        </f:else>
    </f:if>

</div>

<style>
.rescue-statistics__layout      { display:flex; gap:2rem; align-items:flex-start; flex-wrap:wrap; margin:1rem 0 2rem; }
.rescue-statistics__chart-wrap  { flex:0 0 220px; }
.rescue-statistics__table-wrap  { flex:1 1 300px; }
.rescue-statistics__table       { width:100%; border-collapse:collapse; }
.rescue-statistics__table th,
.rescue-statistics__table td    { padding:.35rem .6rem; border-bottom:1px solid #ddd; vertical-align:middle; }
.rescue-statistics__num         { text-align:right; white-space:nowrap; }
.rescue-statistics__dot         { display:inline-block; width:14px; height:14px; border-radius:50%; }
.rescue-statistics__total       { font-size:.85em; font-weight:normal; color:#666; margin-left:.5rem; }
.rescue-statistics__year-title  { margin-bottom:.25rem; }
</style>

</f:section>
